plugins {
    // Tells Gradle this is a Java project so it compiles code and builds JARs
    id 'java'
    // Optional: Tells Gradle this is an executable application
    id 'application'
}
repositories {
    // Allows your project to download external libraries/dependencies if needed
    mavenCentral()
}
dependencies {
    // You can add your testing framework or libraries here later
    implementation 'com.github.lalyos:jfiglet:0.0.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}
java {
    // Matches the JDK 21 environment we set up in your GitHub Action
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
application {
    // If your app has a 'public static void main' class, define it here
    // Example: mainClass = 'com.example.Main'
}
